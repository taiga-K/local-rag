embedding:
  model: cl-nagoya/ruri-v3-310m
  device: cpu
  backend: sentence-transformers
keyword:
  tokenizers: [sudachi, char_bigram, fastembed]
search:
  # Query-time only. The index still stores every tokenizer above.
  # A: [dense, fastembed]  B: [dense, sudachi, char_bigram]  C: [dense]
  legs: [dense, fastembed]
  sudachi:
    mode: C
    normalize: true
  char_bigram:
    nfkc: true
    casefold: false
    drop_space: true
    drop_control: true
    drop_punct: false
fusion:
  method: rrf
  k: 1
bm25:
  k1: 1.2
  b: 0.75
redis:
  lanes: 1
