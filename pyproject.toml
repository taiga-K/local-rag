[project]
name = "kbindex"
version = "0.1.0"
description = "Local Japanese retrieval. Push blocks, return chunks. No LLM."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "qdrant-client>=1.12",
  "pyyaml>=6.0",
  "sudachipy>=0.6.8",
  "sudachidict-core>=20240109",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
embed = [
  "sentence-transformers>=3.3",
  "transformers>=4.48",
]
dev = [
  "pytest>=8.3",
  "fakeredis>=2.26",
  "httpx>=0.27",
]

[project.scripts]
kbindex-api = "kbindex.api:main"
kbindex-worker = "kbindex.worker:main"
kbindex-ingest = "kbindex.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs Postgres, Redis, and Qdrant",
  "slow: loads cl-nagoya/ruri-v3-310m",
]
addopts = "-m 'not integration and not slow'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kbindex*"]
