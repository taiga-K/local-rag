services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kbindex
      POSTGRES_PASSWORD: kbindex
      POSTGRES_DB: kbindex
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbindex"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.2-alpine
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.15.0
    ports:
      - "46333:6333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://kbindex:kbindex@postgres:5432/kbindex
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data/records
      HF_HOME: /data/hf
      PORT: "43123"
      KBINDEX_CONFIG: /app/config.yaml
    volumes:
      - records:/data/records
      - hf:/data/hf
    ports:
      - "43123:43123"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
  worker:
    build: .
    command: ["kbindex-worker"]
    environment:
      DATABASE_URL: postgresql://kbindex:kbindex@postgres:5432/kbindex
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data/records
      HF_HOME: /data/hf
      KBINDEX_CONFIG: /app/config.yaml
    volumes:
      - records:/data/records
      - hf:/data/hf
    depends_on:
      api:
        condition: service_started
volumes:
  records:
  hf:
