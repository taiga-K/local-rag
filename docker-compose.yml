services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kbindex
      POSTGRES_PASSWORD: kbindex
      POSTGRES_DB: kbindex
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbindex"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.2-alpine
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.15.0
    ports:
      - "46333:6333"
  # api and worker talk to the other services over the compose network.
  # network_mode: host does not work on Docker Desktop for Windows and macOS:
  # the "host" is the Linux VM, so 127.0.0.1:43123 on Windows never reaches it.
  # Linux machines whose bridge drops container-to-container packets can add
  # docker-compose.hostnet.yml.
  api:
    build: .
    ports:
      - "127.0.0.1:43123:43123"
    environment:
      DATABASE_URL: postgresql://kbindex:kbindex@postgres:5432/kbindex
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data/records
      HF_HOME: /data/hf
      PORT: "43123"
      KBINDEX_CONFIG: /app/config.yaml
    volumes:
      - records:/data/records
      - hf:/data/hf
      - ./kbindex:/app/kbindex
      - ./config.yaml:/app/config.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:43123/api/v1/settings/local', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
  worker:
    build: .
    command: ["kbindex-worker"]
    environment:
      DATABASE_URL: postgresql://kbindex:kbindex@postgres:5432/kbindex
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data/records
      HF_HOME: /data/hf
      KBINDEX_CONFIG: /app/config.yaml
    volumes:
      - records:/data/records
      - hf:/data/hf
      - ./kbindex:/app/kbindex
      - ./config.yaml:/app/config.yaml
    depends_on:
      api:
        condition: service_healthy
volumes:
  records:
  hf:
