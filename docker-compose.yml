services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kbindex
      POSTGRES_PASSWORD: kbindex
      POSTGRES_DB: kbindex
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbindex"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.2-alpine
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.15.0
    ports:
      - "46333:6333"
  # api and worker use the host network so they can reach the published
  # ports. On this VM the compose bridge does not forward container-to-container
  # packets (dockerd nftables setup). The same URLs work when the ports are published.
  api:
    build: .
    network_mode: host
    environment:
      DATABASE_URL: postgresql://kbindex:kbindex@127.0.0.1:54329/kbindex
      REDIS_URL: redis://127.0.0.1:63799/0
      QDRANT_URL: http://127.0.0.1:46333
      DATA_DIR: /data/records
      HF_HOME: /data/hf
      PORT: "43123"
      KBINDEX_CONFIG: /app/config.yaml
    volumes:
      - records:/data/records
      - hf:/data/hf
      - ./kbindex:/app/kbindex
      - ./config.yaml:/app/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
  worker:
    build: .
    command: ["kbindex-worker"]
    network_mode: host
    environment:
      DATABASE_URL: postgresql://kbindex:kbindex@127.0.0.1:54329/kbindex
      REDIS_URL: redis://127.0.0.1:63799/0
      QDRANT_URL: http://127.0.0.1:46333
      DATA_DIR: /data/records
      HF_HOME: /data/hf
      KBINDEX_CONFIG: /app/config.yaml
    volumes:
      - records:/data/records
      - hf:/data/hf
      - ./kbindex:/app/kbindex
      - ./config.yaml:/app/config.yaml
    depends_on:
      api:
        condition: service_started
volumes:
  records:
  hf:
